<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#e9e9e6" />
<title>AnyField — furry glass</title>
<style>
  :root{ --safe-b: env(safe-area-inset-bottom, 0px); --safe-t: env(safe-area-inset-top, 0px); }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; height:100%; overflow:hidden; background:#e9e9e6;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
    color:#1b1d24; -webkit-font-smoothing:antialiased; overscroll-behavior:none; touch-action:none; }
  #gfx{ position:fixed; inset:0; width:100%; height:100%; display:block; }
  #labels{ position:fixed; inset:0; pointer-events:none; overflow:hidden; }

  .lbl{ position:absolute; transform:translate(-50%,-50%);
    text-align:center; white-space:pre-wrap; word-break:break-word;
    font-size:12px; line-height:1.2; font-weight:600; color:#1b1d24;
    text-shadow:0 1px 2px rgba(255,255,255,.65), 0 0 1px rgba(255,255,255,.5);
    pointer-events:none; }
  .lbl.emote{ font-style:italic; font-weight:500; opacity:.85; }

  /* top chrome */
  #brand{ position:fixed; top:calc(var(--safe-t) + 10px); left:14px; z-index:5;
    font-weight:800; font-size:15px; letter-spacing:.05em; color:#2a2d36; opacity:.92;
    text-shadow:0 1px 3px rgba(255,255,255,.6); }
  #brand b{ color:#2b6cb0; }
  #badge{ position:fixed; top:calc(var(--safe-t) + 12px); right:14px; z-index:5;
    color:#5a5d66; font-size:10px; opacity:.6; transition:opacity 1s; }

  /* the glass chat bubble dock */
  #dock{ position:fixed; left:10px; right:10px; bottom:calc(var(--safe-b) + 10px); z-index:9; }
  /* soft scrim so the glass controls have something to read against on white */
  #scrim{ position:fixed; left:0; right:0; bottom:0; height:210px; z-index:6; pointer-events:none;
    background:linear-gradient(to top, rgba(28,30,42,.22), rgba(28,30,42,.06) 55%, transparent); }
  #bar{ display:flex; align-items:flex-end; gap:8px; padding:7px 8px;
    border-radius:26px;
    background:rgba(255,255,255,.55);
    backdrop-filter:blur(24px) saturate(1.8) brightness(1.04); -webkit-backdrop-filter:blur(24px) saturate(1.8) brightness(1.04);
    border:1px solid rgba(255,255,255,.85);
    box-shadow:0 16px 44px rgba(20,22,32,.30), inset 0 1px 0 rgba(255,255,255,.95),
               inset 0 -10px 24px rgba(120,140,180,.08); }
  .rbtn{ flex:0 0 auto; width:40px; height:40px; border-radius:50%; border:0;
    font-size:20px; font-weight:600; display:flex; align-items:center; justify-content:center;
    background:rgba(255,255,255,.62); color:#2a2d36; border:1px solid rgba(255,255,255,.8);
    backdrop-filter:blur(10px) saturate(1.6); -webkit-backdrop-filter:blur(10px) saturate(1.6);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.95), 0 2px 8px rgba(20,22,32,.18); }
  .rbtn:active{ transform:scale(.92); }
  #msg{ flex:1; resize:none; max-height:104px; min-height:40px; height:40px;
    font-size:16px; line-height:1.35; padding:9px 6px; border:0; outline:0; background:transparent; color:#1b1d24; }
  #msg::placeholder{ color:rgba(40,44,60,.42); }
  #send{ background:linear-gradient(135deg,#cfe6ff,#7fb0ff); color:#082038;
    box-shadow:0 4px 14px rgba(110,160,255,.5); }

  #hint{ position:fixed; left:50%; top:42%; transform:translate(-50%,-50%);
    width:78%; max-width:300px; text-align:center; color:#4a4d57; opacity:.7; font-size:13px; line-height:1.6;
    pointer-events:none; transition:opacity .7s; text-shadow:0 1px 3px rgba(255,255,255,.6); }
  #chips{ position:fixed; left:0; right:0; bottom:calc(var(--safe-b) + 68px); z-index:8;
    display:flex; gap:7px; overflow-x:auto; padding:0 10px 8px; scrollbar-width:none; }
  #chips::-webkit-scrollbar{ display:none; }
  .chip{ flex:0 0 auto; font-size:12px; padding:7px 12px; border-radius:999px; color:#2a2d36;
    background:rgba(255,255,255,.6); border:1px solid rgba(255,255,255,.85);
    backdrop-filter:blur(14px) saturate(1.7) brightness(1.04); -webkit-backdrop-filter:blur(14px) saturate(1.7) brightness(1.04);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.9), 0 3px 10px rgba(20,22,32,.18); white-space:nowrap; }
</style>
</head>
<body>
  <canvas id="gfx"></canvas>
  <div id="labels"></div>
  <div id="brand">Any<b>Field</b></div>
  <div id="badge">…</div>
  <div id="hint">Send anything.<br>It floats up and sticks in the glass —<br>tinting it as it goes.</div>

  <div id="scrim"></div>
  <div id="chips"></div>
  <div id="dock">
    <div id="bar">
      <button class="rbtn" id="plus" aria-label="attach">＋</button>
      <textarea id="msg" rows="1" placeholder="say anything…" autocapitalize="sentences" autocomplete="off"></textarea>
      <button class="rbtn" id="send" aria-label="send">➤</button>
    </div>
  </div>

<script type="module">
/* ===========================================================================
   AnyField — "furry glass" sketch.
   A single sheet of frosted glass (the panel). What you send floats up from
   the chat bubble, packs into the panel, and STICKS — tinting the glass via a
   refraction pass, every edge fringed with soft fur.
   WebGPU primary; Canvas2D fallback so it still runs on any phone.
=========================================================================== */
const W = () => document.documentElement.clientWidth;
const H = () => document.documentElement.clientHeight;
const TOP = () => 78 + (parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--safe-t'))||0);
const BOT = () => H() - 150;                      // resting field stops above the dock

function hsl2rgb(h,s,l){ h=((h%360)+360)%360/360; s=Math.max(0,Math.min(1,s)); l=Math.max(0,Math.min(1,l));
  const a=s*Math.min(l,1-l), k=n=>(n+h*12)%12, f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));
  return [f(0),f(8),f(4)]; }

/* ---- tiny featurizer: a hue + a little affect, so tints vary by content ---- */
const KW=[ [30,.85,['macaron','croissant','🥐','coffee','☕','food','cake','🍰','yum','eat','taste','sweet']],
          [285,.8,['song','music','🎵','🎶','lyric','sing','beat','newjeans','kiss of life','asap','belle','nothing']],
          [335,.85,['love','😍','🥰','❤️','😚','cute','好看','好好看','💕','miss','beautiful']],
          [205,.65,['meow','again','me','我','myself','hi','back','似乎']],
          [128,.6,['brugge','belgium','beach','home','park','travel','place','街']],
          [222,.55,['镜子','gone','朋友','复活','memory','wistful','曾经']],
          [2,.9,['好痛','痛','pain','hurt','边界','拒绝','妥协','get the fuck out','fuck','hate','轰炸']] ];
function feat(text){ const low=text.toLowerCase(); let hue=null,sat=.7;
  for(const [h,s,ws] of KW) for(const w of ws) if(low.includes(w)){ hue=h; sat=s; break; }
  if(hue===null){ let x=0; for(let i=0;i<low.length;i++) x=(x*31+low.charCodeAt(i))>>>0; hue=x%360; sat=.62; }
  let aro=0; const reps=(text.match(/(.)\1\1+/g)||[]).length; if(reps) aro+=Math.min(.6,reps*.22);
  aro+=Math.min(.4,(text.match(/!/g)||[]).length*.15);
  const isEmote=/\*[^*]+\*/.test(text);
  const len=[...text].length;
  return { hue, sat, aro, isEmote, r: Math.max(26, Math.min(66, 26 + len*1.6 + aro*14)) };
}

/* ---- state: glass pills float up and stick ---- */
let ITEMS=[]; let seq=0;
const _mc=document.createElement('canvas').getContext('2d'); _mc.font='600 13px -apple-system,system-ui,sans-serif';
function measure(text){ let mw=0; for(const ln of text.split('\n')) mw=Math.max(mw,_mc.measureText(ln).width); return mw; }
function spawn(text){
  const f=feat(text);
  const raw=measure(text), maxW=224, two=raw>maxW-26;
  const hw=(Math.min(raw,maxW-26)+26)/2, hh=two?30:21;        // half-size of the pill
  ITEMS.push({ id:seq++, text, hue:f.hue, sat:f.sat, isEmote:f.isEmote,
    x: W()/2 + (Math.random()-0.5)*30, y: H()-130, hw, hh,
    vx:(Math.random()-0.5)*0.6, vy:-3.4 - Math.random()*1.2, born:performance.now() });
  if(ITEMS.length>48) ITEMS.shift();   // sketch cap (real product never deletes)
}

/* buoyancy + box-packing physics: rise, repel, stick under the ceiling */
function physics(){
  const top=TOP(), bot=BOT(), L=22, R=W()-22;
  for(const it of ITEMS){
    it.vy += -0.16;                       // buoyancy (y is down)
    it.vy*=0.985; it.vx*=0.985;
    it.x+=it.vx; it.y+=it.vy;
    if(it.y < top+it.hh){ it.y=top+it.hh; it.vy*=-0.18; }
    if(it.y > bot+it.hh){ it.y=bot+it.hh; it.vy=0; }
    if(it.x < L+it.hw){ it.x=L+it.hw; it.vx*=-0.4; }
    if(it.x > R-it.hw){ it.x=R-it.hw; it.vx*=-0.4; }
  }
  for(let i=0;i<ITEMS.length;i++) for(let j=i+1;j<ITEMS.length;j++){
    const a=ITEMS[i],b=ITEMS[j]; const dx=b.x-a.x, dy=b.y-a.y;
    const minx=(a.hw+b.hw)*0.94, miny=(a.hh+b.hh)*0.94+6;
    const ox=minx-Math.abs(dx), oy=miny-Math.abs(dy);
    if(ox>0 && oy>0){                     // overlap -> push apart on the shallower axis
      if(ox<oy){ const s=(dx<0?-1:1)*ox*0.5; a.x-=s; b.x+=s; a.vx-=s*0.06; b.vx+=s*0.06; }
      else     { const s=(dy<0?-1:1)*oy*0.5; a.y-=s; b.y+=s; a.vy-=s*0.06; b.vy+=s*0.06; }
    }
  }
}

/* ===========================================================================
   WebGPU glass renderer
=========================================================================== */
const gfx=document.getElementById('gfx'), labels=document.getElementById('labels'), badge=document.getElementById('badge');
const MAXI=64; let mode='2d';
let device,ctx,fmt,pipe,bind,uBuf,iBuf,uArr,iArr,c2d;

async function initGPU(){
  if(!navigator.gpu) return false;
  let ad; try{ ad=await navigator.gpu.requestAdapter(); }catch(e){ return false; } if(!ad) return false;
  try{ device=await ad.requestDevice(); }catch(e){ return false; }
  ctx=gfx.getContext('webgpu'); if(!ctx) return false;
  fmt=navigator.gpu.getPreferredCanvasFormat(); ctx.configure({device,format:fmt,alphaMode:'opaque'});
  const m=device.createShaderModule({code:WGSL});
  pipe=device.createRenderPipeline({layout:'auto',vertex:{module:m,entryPoint:'vs'},
    fragment:{module:m,entryPoint:'fs',targets:[{format:fmt}]},primitive:{topology:'triangle-list'}});
  uArr=new Float32Array(4); iArr=new Float32Array(MAXI*8);
  uBuf=device.createBuffer({size:16,usage:GPUBufferUsage.UNIFORM|GPUBufferUsage.COPY_DST});
  iBuf=device.createBuffer({size:iArr.byteLength,usage:GPUBufferUsage.STORAGE|GPUBufferUsage.COPY_DST});
  bind=device.createBindGroup({layout:pipe.getBindGroupLayout(0),entries:[
    {binding:0,resource:{buffer:uBuf}},{binding:1,resource:{buffer:iBuf}}]});
  return true;
}

const WGSL=`
struct It { a: vec4<f32>, c: vec4<f32> };  // a.xy=center, a.zw=half-size ; c.rgb=tint, c.a=freshness glow
struct U { res: vec2<f32>, time: f32, n: f32 };
@group(0) @binding(0) var<uniform> u: U;
@group(0) @binding(1) var<storage,read> items: array<It>;

@vertex fn vs(@builtin(vertex_index) i:u32)->@builtin(position) vec4<f32>{
  var p=array<vec2<f32>,3>(vec2(-1.,-1.),vec2(3.,-1.),vec2(-1.,3.)); return vec4(p[i],0.,1.); }

fn h21(p:vec2<f32>)->f32{ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453); }
fn vn(p:vec2<f32>)->f32{ let i=floor(p); let f=fract(p); let u=f*f*(3.-2.*f);
  return mix(mix(h21(i),h21(i+vec2(1.,0.)),u.x),mix(h21(i+vec2(0.,1.)),h21(i+vec2(1.,1.)),u.x),u.y); }
fn gss(uv:vec2<f32>,c:vec2<f32>,s:f32)->f32{ let d=uv-c; return exp(-dot(d,d)/(2.*s*s)); }
// signed distance to a rounded box (the glass pill)
fn sdBox(p:vec2<f32>, b:vec2<f32>, r:f32)->f32{
  let q=abs(p)-b+vec2(r,r);
  return length(max(q,vec2(0.0,0.0))) + min(max(q.x,q.y),0.0) - r;
}

// the surface BEHIND the glass — granite white. Its fine mineral speckle is
// what makes the refraction read as glass.
fn bg(px:vec2<f32>)->vec3<f32>{
  let p=px;
  // soft cloudy mottling (fbm)
  let mottle = vn(p*0.016)*0.55 + vn(p*0.055)*0.28 + vn(p*0.14)*0.17;
  var base = mix(0.80, 0.985, mottle);
  base += (vn(p*0.9)-0.5)*0.10;                 // mid grain
  var col=vec3(base);
  // sparse mineral flecks (grey, black, faint warm/cool)
  if(h21(floor(p*0.7))      > 0.945){ col -= vec3(0.30); }
  if(h21(floor(p*1.7)+19.)  > 0.978){ col -= vec3(0.46); }
  if(h21(floor(p*0.5)+7.)   > 0.960){ col += vec3(0.06,0.03,0.0); }
  if(h21(floor(p*0.95)+33.) > 0.965){ col -= vec3(0.0,0.02,0.05); }
  return clamp(col,vec3(0.0),vec3(1.0));
}

@fragment fn fs(@builtin(position) fc:vec4<f32>)->@location(0) vec4<f32>{
  let px=fc.xy;
  var col=bg(px);
  let n=u32(u.n);

  // ---- soft contact shadows so the glass floats above the slab ----
  var sh=0.0;
  for(var k=0u;k<n;k++){ let it=items[k]; let b=it.a.zw;
    if(length(px-it.a.xy-vec2(0.0,9.0)) > max(b.x,b.y)+24.0){ continue; }
    let d=sdBox(px-it.a.xy-vec2(0.0,9.0), b, min(b.x,b.y));
    sh=max(sh, 1.0 - smoothstep(-2.0, 20.0, d)); }
  col*= 1.0 - sh*0.16;

  // ---- Liquid Glass pills ----
  for(var k=0u;k<n;k++){
    let it=items[k]; let c=it.a.xy; let b=it.a.zw; let rad=min(b.x,b.y);
    let p=px-c;
    if(abs(p.x)>b.x+3.0 || abs(p.y)>b.y+3.0){ continue; }
    let d=sdBox(p,b,rad);
    let cov=1.0 - smoothstep(-1.1,1.1,d);                     // anti-aliased coverage
    if(cov<0.002){ continue; }

    // surface normal (numeric gradient of the SDF)
    let e=2.0;
    let gx=sdBox(p+vec2(e,0.0),b,rad)-sdBox(p-vec2(e,0.0),b,rad);
    let gy=sdBox(p+vec2(0.0,e),b,rad)-sdBox(p-vec2(0.0,e),b,rad);
    let nrm=normalize(vec2(gx,gy)+vec2(0.0001,0.0));

    // EDGE LENSING — refraction concentrates at the rounded rim, clear in the center
    let edge=smoothstep(-15.0, 0.0, d);                       // 0 at center -> 1 at rim
    let lens=nrm*edge*edge*22.0;
    // chromatic dispersion + a touch of frost
    let rr=bg(px+lens*1.08).r;
    let gg=bg(px+lens).g;
    let bb=bg(px+lens*0.92).b;
    var ref=vec3(rr,gg,bb);
    ref=mix(ref, (bg(px+lens+vec2(2.0,2.0))+bg(px+lens+vec2(-2.0,-2.0)))*0.5, 0.30);

    var glass=ref;
    glass=mix(glass, vec3(1.0,1.0,1.0), 0.05);               // faint milky translucency
    glass+=it.c.rgb*0.10;                                     // subtle adaptive tint from content
    glass+=it.c.rgb*it.c.a*0.16;                             // freshness glow (fades to clear)

    // specular highlight tracing the top edge (the Liquid Glass signature)
    let L=normalize(vec2(-0.35,-1.0));
    let band=1.0 - smoothstep(0.0,3.0, abs(d+2.0));           // thin band just inside the rim
    glass+=vec3(1.0)*pow(max(dot(nrm,L),0.0),1.5)*band*0.95;
    // darker bottom rim for thickness
    glass-=vec3(0.05)*band*max(dot(nrm,vec2(0.0,1.0)),0.0);
    glass+=vec3(1.0)*edge*edge*0.08;                          // overall fresnel
    let sheen=clamp(-p.y/(b.y*1.4),0.0,1.0)*(1.0-edge)*0.10;  // glossy top sheen inside
    glass+=vec3(sheen);

    col=mix(col, glass, cov);
  }
  let q=px/u.res-0.5; col*=1.0-dot(q,q)*0.14;                 // soft vignette
  return vec4(pow(clamp(col,vec3(0.),vec3(1.)),vec3(0.96)),1.0);
}
`;

function resize(){ const w=Math.round(W()),h=Math.round(H()); gfx.width=w; gfx.height=h;
  gfx.style.width=w+'px'; gfx.style.height=h+'px'; }

let t0=performance.now();
function frame(){
  const now=performance.now(), time=(now-t0)/1000;
  physics();
  if(mode==='gpu') drawGPU(time); else drawCanvas(time);
  drawLabels(now);
  requestAnimationFrame(frame);
}

function drawGPU(time){
  iArr.fill(0);
  const list=ITEMS.slice(-MAXI);
  list.forEach((it,i)=>{ const [r,g,b]=hsl2rgb(it.hue,it.sat,0.6);
    const age=Math.min(1,(performance.now()-it.born)/2500);
    const o=i*8; iArr[o]=it.x; iArr[o+1]=it.y; iArr[o+2]=it.hw; iArr[o+3]=it.hh;
    iArr[o+4]=r; iArr[o+5]=g; iArr[o+6]=b; iArr[o+7]=1-age; });
  uArr[0]=gfx.width; uArr[1]=gfx.height; uArr[2]=time; uArr[3]=list.length;
  device.queue.writeBuffer(uBuf,0,uArr); device.queue.writeBuffer(iBuf,0,iArr);
  const e=device.createCommandEncoder();
  const p=e.beginRenderPass({colorAttachments:[{view:ctx.getCurrentTexture().createView(),
    clearValue:{r:0.91,g:0.91,b:0.90,a:1},loadOp:'clear',storeOp:'store'}]});
  p.setPipeline(pipe); p.setBindGroup(0,bind); p.draw(3); p.end();
  device.queue.submit([e.finish()]);
}

/* a cached granite-white speckle surface for the Canvas2D fallback */
let granite=null;
function makeGranite(w,h){ const c=document.createElement('canvas'); c.width=w; c.height=h; const g=c.getContext('2d');
  const grd=g.createLinearGradient(0,0,0,h); grd.addColorStop(0,'#f2f2ef'); grd.addColorStop(1,'#e4e4e0');
  g.fillStyle=grd; g.fillRect(0,0,w,h);
  for(let i=0;i<w*h/90;i++){ const x=Math.random()*w,y=Math.random()*h,r=Math.random()*1.6;
    const v=Math.random(); g.fillStyle = v>0.7?`rgba(60,60,64,${0.18+Math.random()*0.25})`
      : v>0.4?`rgba(150,150,150,0.18)` : `rgba(255,255,255,0.22)`;
    g.beginPath(); g.arc(x,y,r,0,7); g.fill(); }
  return c; }
function drawCanvas(time){
  if(!c2d) c2d=gfx.getContext('2d'); const w=gfx.width,h=gfx.height;
  if(!granite || granite.width!==w || granite.height!==h) granite=makeGranite(w,h);
  c2d.drawImage(granite,0,0);
  for(const it of ITEMS.slice(-MAXI)){ const [r,g,b]=hsl2rgb(it.hue,it.sat,0.62).map(v=>(v*255)|0);
    const x=it.x-it.hw, y=it.y-it.hh, w2=it.hw*2, h2=it.hh*2, rad=Math.min(it.hw,it.hh);
    // contact shadow
    c2d.save(); c2d.shadowColor='rgba(40,44,60,0.28)'; c2d.shadowBlur=18; c2d.shadowOffsetY=8;
    rrect(c2d,x,y,w2,h2,rad); c2d.fillStyle='rgba(255,255,255,0.55)'; c2d.fill(); c2d.restore();
    // glass body: faint tint gradient
    rrect(c2d,x,y,w2,h2,rad);
    const grd=c2d.createLinearGradient(x,y,x,y+h2);
    grd.addColorStop(0,`rgba(${r},${g},${b},0.26)`); grd.addColorStop(1,`rgba(${r},${g},${b},0.10)`);
    c2d.fillStyle=grd; c2d.fill();
    // bright top edge highlight
    c2d.lineWidth=1.2; c2d.strokeStyle='rgba(255,255,255,0.75)';
    rrect(c2d,x+0.6,y+0.6,w2-1.2,h2-1.2,rad); c2d.stroke();
  }
}
function rrect(g,x,y,w,h,r){ r=Math.min(r,w/2,h/2); g.beginPath();
  g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r);
  g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); }

/* crisp verbatim text centered on each glass blob */
const elMap=new Map();
function drawLabels(now){
  const alive=new Set();
  for(const it of ITEMS){ alive.add(it.id); let e=elMap.get(it.id);
    if(!e){ e=document.createElement('div'); e.className='lbl'+(it.isEmote?' emote':''); labels.appendChild(e);
      e.textContent=it.text; elMap.set(it.id,e); }
    e.style.transform=`translate(${it.x}px,${it.y}px) translate(-50%,-50%)`;
    e.style.maxWidth=(it.hw*2-14)+'px';
    e.style.fontSize='13px';
  }
  for(const [id,e] of elMap){ if(!alive.has(id)){ e.remove(); elMap.delete(id); } }
}

/* ---- input ---- */
const msg=document.getElementById('msg'), hint=document.getElementById('hint'); let first=true;
function send(t){ t=t.replace(/\s+$/,''); if(!t) return; if(first){ hint.style.opacity='0'; first=false; } spawn(t); }
document.getElementById('send').onclick=()=>{ send(msg.value); msg.value=''; msg.style.height='40px'; };
document.getElementById('plus').onclick=()=>{ send('📎 attachment'); };
msg.addEventListener('input',()=>{ msg.style.height='40px'; msg.style.height=Math.min(104,msg.scrollHeight)+'px'; });
msg.addEventListener('keydown',e=>{ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); send(msg.value); msg.value=''; msg.style.height='40px'; } });

const CHIPS=['I love this macaron 🥐','🎵 Nothing — KISS OF LIFE',"it's not worth ittt",'Belle好好看','😚😚😚','Meow','好痛','*震惊/诧异*'];
const chips=document.getElementById('chips');
for(const c of CHIPS){ const b=document.createElement('button'); b.className='chip'; b.textContent=c; b.onclick=()=>send(c); chips.appendChild(b); }

/* ---- boot ---- */
(async function(){
  resize(); addEventListener('resize',resize); addEventListener('orientationchange',()=>setTimeout(resize,250));
  const ok=await initGPU(); mode=ok?'gpu':'2d';
  badge.textContent=ok?'WebGPU ✓':'Canvas2D'; setTimeout(()=>badge.style.opacity='0',3000);
  requestAnimationFrame(frame);
})();
</script>
